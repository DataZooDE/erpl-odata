#
# Reusable workflow: post-build smoke test for the erpl_odata DuckDB extension.
#
# Downloads the official DuckDB CLI binary for the target version from GitHub
# releases, then loads the built extension artifact and runs a minimal
# end-to-end test (load extension + real HTTP request). Mirrors exactly what
# a user would do when installing the extension.
#
# Call this workflow AFTER the build job and BEFORE the deploy job so that a
# broken extension on any platform blocks deployment.
#

name: Extension Smoke Test

on:
  workflow_call:
    inputs:
      extension_name:
        required: true
        type: string
      duckdb_version:
        required: true
        type: string
      # ';' separated list of architectures excluded from the build job.
      # Must match the build job's exclude_archs so we don't try to download
      # an artifact that was never produced. Honoured by the job-level `if` below;
      # this input was previously accepted and then ignored, so excluding an arch
      # from the build still ran its smoke test, which failed downloading an
      # artifact nobody had built.
      exclude_archs:
        required: false
        type: string
        default: ""
      # Postfix added to artifact names. Must match the build job's setting.
      artifact_postfix:
        required: false
        type: string
        default: ""

jobs:
  # The matrix is filtered here rather than with a job-level `if`, because the `matrix`
  # context is NOT available in a job-level `if` - a workflow using one fails validation
  # and spawns no jobs at all.
  #
  # The membership test is delimiter-safe: the arch names overlap, so a bare substring
  # test would make excluding `windows_amd64_rtools` also drop `windows_amd64`.
  select-archs:
    name: Select architectures
    timeout-minutes: 15
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - id: filter
        shell: bash
        env:
          EXCLUDE_ARCHS: ${{ inputs.exclude_archs }}
        run: |
          set -euo pipefail
          all='[{"arch":"linux_amd64","runner":"ubuntu-24.04"},
                {"arch":"osx_arm64","runner":"macos-latest"},
                {"arch":"windows_amd64","runner":"windows-latest"}]'
          excluded=";${EXCLUDE_ARCHS};"
          # Bind the element to $e first: inside the `|` the `.` is $ex (a string), so
          # `.arch` there would index a string rather than the matrix entry.
          matrix=$(echo "$all" | jq -c --arg ex "$excluded" \
            '[.[] | . as $e | select(($ex | contains(";" + $e.arch + ";")) | not)]')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$(echo "$matrix" | jq 'length')" -gt 0 ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Smoke-testing: $matrix"

  smoke-test:
    name: Smoke test (${{ matrix.arch }})
    needs: select-archs
    if: needs.select-archs.outputs.any == 'true'
    strategy:
      # Run all platforms even if one fails so we see the full picture
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select-archs.outputs.matrix) }}
    timeout-minutes: 15
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.extension_name }}-${{ inputs.duckdb_version }}-extension-${{ matrix.arch }}${{ inputs.artifact_postfix }}
          path: ./extension_artifact

      - name: Run smoke test (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          EXTENSION_PATH="$(pwd)/extension_artifact/${{ inputs.extension_name }}.duckdb_extension"
          python3 scripts/smoke_test.py \
            "${EXTENSION_PATH}" \
            "${{ inputs.duckdb_version }}" \
            "${{ matrix.arch }}"

      - name: Run smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ext = Join-Path $PWD "extension_artifact\${{ inputs.extension_name }}.duckdb_extension"
          python scripts/smoke_test.py "$ext" "${{ inputs.duckdb_version }}" "${{ matrix.arch }}"
