#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#

name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
    tags: ['**']
    paths-ignore:
      - '**/README.md'
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  # datazoo-oauth2's own Catch2 suite, which NOTHING used to run.
  #
  # Its cmake target is guarded on the submodule being the top-level project, and every
  # build this repo makes add_subdirectory()s it - so the guard was always false and the
  # suite was never compiled. That left the only coverage of
  # OAuth2CallbackHandler::ValidateState (the CSRF defence of the authorization_code flow),
  # the PKCE/state token generator, and the callback error page's HTML escaping running
  # nowhere. See GitHub #245.
  #
  # Cheap and independent of the extension build, so it is not gated on it: a broken CSRF
  # check should not wait ~25 minutes behind a Windows build to be reported.
  oauth2-unit-tests:
    name: datazoo-oauth2 unit tests
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Catch2
        run: |
          sudo apt-get update
          sudo apt-get install -y catch2 cmake ninja-build

      - name: Build and run
        run: make test_oauth2

  duckdb-v155-build:
    name: Build extension binaries (v1.5.6)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      extension_name: erpl_odata
      ci_tools_version: v1.5-variegata
      vcpkg_commit: 84bab45d415d22042bd0b9081aea57f362da3f35
      exclude_archs: 'windows_amd64_rtools;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads;'
      extra_extension_config: |
        if(CMAKE_CXX_COMPILER_ID STREQUAL "GNU")
          set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -fno-gnu-unique")
        endif()

  duckdb-next-build:
    name: Build extension binaries (v2.0 pre-release)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: d54cbbe3df17e8e5ce68312f483b4155836112aa
      extension_name: erpl_odata
      ci_tools_version: v2.0-cyanoptera
      vcpkg_commit: 84bab45d415d22042bd0b9081aea57f362da3f35
      exclude_archs: 'windows_amd64_rtools;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads;'
      extra_extension_config: |
        if(CMAKE_CXX_COMPILER_ID STREQUAL "GNU")
          set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -fno-gnu-unique")
        endif()

  duckdb-v155-smoke-test:
    name: Smoke test (v1.5.6)
    needs: duckdb-v155-build
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v1.5.6
      extension_name: erpl_odata
      exclude_archs: 'windows_amd64_rtools;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads;'

  duckdb-v155-deploy:
    name: Deploy extension binaries (v1.5.6)
    needs: [duckdb-v155-build, duckdb-v155-smoke-test]
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v1.5.6
      extension_name: erpl_odata
      exclude_archs: 'windows_amd64_rtools;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads;'
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      # Versioned paths (<name>/vYYYY.MM.DD/...) come ONLY from the tag run. A main
      # push of the same commit builds before the tag exists (stamp vX-N-gSHA), and its
      # deploy resolves the tag at upload time: if it runs after the tag run it
      # overwrites the release with that pre-tag build (hit duckdb-gdrive v2026.10.17).
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') }}
